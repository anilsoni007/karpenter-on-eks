apiVersion: v1
kind: Namespace
metadata:
  name: karpenter-upgrade-lab
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: upgrade-canary
  namespace: karpenter-upgrade-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: upgrade-canary
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upgrade-canary
  namespace: karpenter-upgrade-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: upgrade-canary
  template:
    metadata:
      labels:
        app: upgrade-canary
    spec:
      nodeSelector:
        nodepool: upgrade-canary
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: upgrade-canary
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.7
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
