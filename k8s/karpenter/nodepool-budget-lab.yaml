apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: budget-lab
spec:
  weight: 20

  template:
    metadata:
      labels:
        nodepool: budget-lab

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small", "metal"]

      expireAfter: 720h

  limits:
    cpu: "20"
    memory: 80Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets:
      # Baseline rate for voluntary disruption.
      - nodes: "10%"

      # Pause consolidation of underutilized nodes and drift replacement
      # during the weekday maintenance window. The schedule is in UTC.
      - nodes: "0"
        schedule: "0 9 * * mon-fri"
        duration: 8h
        reasons:
          - Underutilized
          - Drifted
