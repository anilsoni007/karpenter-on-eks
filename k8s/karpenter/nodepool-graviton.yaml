apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: graviton
spec:
  weight: 20

  template:
    metadata:
      labels:
        nodepool: graviton

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        # Graviton instances are in the c, m, r families with the 'g' suffix
        # e.g., c7g, m7g, r7g
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]

        # ARM64 only — this is what makes it Graviton
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]

        # Graviton Spot is extremely cost-effective
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]

        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small", "metal"]

      expireAfter: 720h

  limits:
    cpu: "50"
    memory: 200Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
