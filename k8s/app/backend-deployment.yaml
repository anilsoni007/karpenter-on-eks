apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: shopfront
  labels:
    app: backend-api
spec:
  # Start with 2 replicas. HPA in Lab 04 will scale this up/down.
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      # Spread pods across nodes and AZs.
      # This ensures that when Karpenter provisions multiple nodes,
      # pods don't all land on the same one.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend-api
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend-api

      containers:
        - name: backend-api
          # Replace with your ECR image URI after building
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/shopfront-backend:latest
          ports:
            - containerPort: 3000

          env:
            # Downward API — injects pod and node metadata as env vars.
            # The backend uses these to report which pod/node served a request,
            # and to expose the Karpenter capacity-type label to the frontend.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Read the Karpenter capacity-type label from the node.
            # This is how the frontend knows if it's running on Spot or On-Demand.
            - name: CAPACITY_TYPE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['karpenter.sh/capacity-type']

          resources:
            requests:
              # Resource requests are what Karpenter uses for bin-packing.
              # Karpenter sums up all pending pod requests to determine
              # the minimum node size needed. Set these accurately.
              cpu: "250m"
              memory: "256Mi"
            limits:
              # CPU limits throttle — don't set them too low or you'll
              # get unexpected latency spikes under load.
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

      # Graceful termination — give in-flight requests time to complete
      # before the pod is killed. Matches the ALB deregistration delay.
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: shopfront
spec:
  selector:
    app: backend-api
  ports:
    - port: 3000
      targetPort: 3000
  # ClusterIP — only reachable within the cluster.
  # The frontend Nginx proxies to this service by DNS name.
  type: ClusterIP
